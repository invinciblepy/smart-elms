<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submission confirmed · Smart ELMS</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body class="app-body" data-role="student" data-page="confirm">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar"><h1>Submission confirmed</h1></header>
      <main class="content">
        <article class="card" style="max-width:640px;margin:0 auto">
          <h2>Your work is in</h2>
          <p id="confirmMeta" class="muted">Loading confirmation…</p>
          <p>You can replace the file from the assignment page until the deadline. Your instructor will see the comment and any uploaded file.</p>
          <div class="form-actions">
            <a class="btn" id="gradesLink" href="/student/grades">View grades</a>
            <a class="btn btn-ghost" id="backLink" href="/student/assignments">Back to assignments</a>
          </div>
        </article>
      </main>
    </div>
  </div>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/app.js"></script>
</body>
</html>
